name: ICONIC CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: iconic-main-deploy
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ci
      JWT_SECRET: ci-only-secret
      NEXT_PUBLIC_API_URL: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Type check
        run: npx tsc --noEmit --incremental false

      - name: Production build
        run: npm run build

  deploy:
    name: Deploy to cPanel
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy through SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            cd /home/uqqwmiabhosting/public_html/iconic2026.huitmedia.edu.vn
            export PATH=/opt/alt/alt-nodejs22/root/usr/bin:$PATH
            export NODE_OPTIONS=--max-old-space-size=640
            export NEXT_DISABLE_SWC_WORKER=1
            export NEXT_TELEMETRY_DISABLED=1
            export NEXT_CPU_COUNT=1
            export CI_SKIP_TYPECHECK=1
            git switch main
            git pull --ff-only origin main
            npm install --include=dev --no-audit --no-fund
            npx prisma db push --skip-generate
            rm -rf .next/cache
            for attempt in 1 2 3; do
              if npx next build; then
                break
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "next build failed on attempt $attempt (often transient on cPanel), retrying..."
                sleep 10
              else
                echo "next build failed after 3 attempts"
                exit 1
              fi
            done
            mkdir -p tmp
            touch tmp/restart.txt
